name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk GingerbreadLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GingerbreadLauncher
          path: GingerbreadLauncher.apk

      # A release gives a direct download link that works from the phone's browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gingerbread Launcher (build ${{ github.run_number }})
          body: Download GingerbreadLauncher.apk below, open it on your phone and install it. Then press Home and choose Gingerbread Launcher.
          files: GingerbreadLauncher.apk
          make_latest: true
