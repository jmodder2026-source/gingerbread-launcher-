plugins {
    id 'com.android.application'
}

android {
    namespace 'net.gingerbread.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'net.gingerbread.launcher'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without a separate keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        // The simulator's audio, images and fonts are already compressed.
        noCompress += ['webp', 'jpg', 'png', 'ogg', 'mp3', 'm4a', 'ttf', 'woff2']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
