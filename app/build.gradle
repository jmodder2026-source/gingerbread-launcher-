plugins {
    id 'com.android.application'
}

android {
    namespace 'net.gingerbread.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'net.gingerbread.launcher'
        minSdk 24
        targetSdk 34
        versionCode 27
        versionName '4.2'
    }

    // One fixed key for every build, so a new APK installs over the old one. Like Android's own debug key, it is
    // public: fine for a launcher you install yourself, not for publishing to a store.
    signingConfigs {
        fixed {
            storeFile rootProject.file('signing/launcher.keystore')
            storePassword 'android'
            keyAlias 'gingerbread'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        // The simulator's audio, images and fonts are already compressed.
        noCompress += ['webp', 'jpg', 'png', 'ogg', 'mp3', 'm4a', 'ttf', 'woff2']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
